[project]
name = "exterminus"
version = "1.1.0"
description = "A Flask application for scheduling pest-control jobs and technician time off."
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.2",
    "flask-wtf==1.2.2",
    "holidays==0.78",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "werkzeug==3.1.3",
    "zipcodes==1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.1.0"
tag_format = "v$version"
update_changelog_on_bump = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


